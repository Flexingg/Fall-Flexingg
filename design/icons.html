<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#2b2b2e;font-family:'Liberation Sans',sans-serif;color:#fff;padding:48px;width:1100px}
.row{display:flex;gap:40px;align-items:flex-end;margin-bottom:44px}.row div{text-align:center;font-size:13px;color:#aaa}
img{display:block;margin:0 auto 8px}.big{border-radius:226px}
.home{background:linear-gradient(160deg,#3b4a6b,#1d2540);border-radius:36px;padding:36px;display:grid;grid-template-columns:repeat(4,100px);gap:28px 30px;width:max-content}
.ap{text-align:center;font-size:12px}.ap i{display:block;width:100px;height:100px;border-radius:23px;background:#e5e5ea;margin-bottom:6px}
.ap img{width:100px;height:100px;border-radius:23px;margin:0 0 6px}
</style></head><body>
<div class="row"><div><img class="big" src="icon.svg" width="360" height="360">Gauntlet · 1024 master</div>
<div><img src="icon.svg" width="120" height="120" style="border-radius:27px">120<br><br><img src="icon.svg" width="60" height="60" style="border-radius:14px">60<br><br><img src="icon.svg" width="29" height="29" style="border-radius:7px">29</div>
<div><img src="icon.svg" width="120" height="120" style="border-radius:60px;box-shadow:0 0 0 1px #444">Android round<br><br><img src="icon.svg" width="120" height="120" style="border-radius:34px;filter:invert(1)">Light-mode check (inverted)</div></div>
<div class="home">
<div class="ap"><i></i>Mail</div><div class="ap"><i></i>Maps</div><div class="ap"><img src="icon.svg">Gauntlet</div><div class="ap"><i></i>Photos</div>
<div class="ap"><i></i>Health</div><div class="ap"><i></i>Notes</div><div class="ap"><i></i>Music</div><div class="ap"><i></i>Camera</div></div>
</body></html>
