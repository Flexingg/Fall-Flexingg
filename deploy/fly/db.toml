# Postgres 18 for both Gauntlet and SparkyFitness (separate databases and roles).
# Private: reachable only inside the Fly organisation as <prefix>-db.internal:5432.
primary_region = 'iad'

[mounts]
  source = 'pgdata'
  destination = '/var/lib/postgresql'
  initial_size = '3gb'
  # Fly snapshots the volume daily; keep two weeks.
  snapshot_retention = 14

[checks]
  [checks.postgres]
    type = 'tcp'
    port = 5432
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
