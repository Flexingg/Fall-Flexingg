# SparkyFitness website (pinned release): serves its web app and proxies /api to the private
# SparkyFitness server. This is the public SparkyFitness address phones and browsers use.
primary_region = 'iad'

[build]
  image = 'codewithcj/sparkyfitness:v1.7.3'

[env]
  SPARKY_FITNESS_SERVER_PORT = '3010'
  NGINX_LISTEN_PORT = '80'
  # Fly's internal DNS; brackets because it's an IPv6 address.
  NGINX_RESOLVER = '[fdaa::3]'

[http_service]
  internal_port = 80
  force_https = true
  # Sleeps when nobody uses it; the first request wakes it in about a second.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
