# Gauntlet API + PWA. The app name comes from deploy.sh (--app <prefix>).
primary_region = 'iad'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  SYNC_INTERVAL_MINUTES = '15'
  DOWNLOADS_DIR = '/app/downloads'
  # The Android app's WebView origins.
  EXTRA_ORIGINS = 'https://localhost,capacitor://localhost'

[deploy]
  # Start the new machine, wait for it to pass its health check, then switch; a bad build never
  # replaces a working one.
  strategy = 'bluegreen'

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler (syncs, finishing challenges) runs in-process, so keep one machine up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
