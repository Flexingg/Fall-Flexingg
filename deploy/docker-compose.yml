# The whole Gauntlet backend on one machine: Postgres, SparkyFitness (API + web UI) and Gauntlet.
# Fly.io is the main deploy (deploy/fly); this file is for self-hosting, local testing and CI.
#
#   cp deploy/.env.example deploy/.env      # fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Gauntlet: http://localhost:${GAUNTLET_PORT:-8080}   SparkyFitness: http://localhost:${SPARKY_PORT:-3004}
services:
  db:
    build: ./postgres
    image: gauntlet-postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      GAUNTLET_DB_PASSWORD: ${GAUNTLET_DB_PASSWORD:?set GAUNTLET_DB_PASSWORD}
      SPARKY_DB_PASSWORD: ${SPARKY_DB_PASSWORD:?set SPARKY_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  sparky-api:
    image: codewithcj/sparkyfitness_server:${SPARKY_VERSION:-v1.7.3}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/New_York}
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_PUBLIC_URL:-http://localhost:3004}
      # Other addresses the SparkyFitness site is reached at (comma separated), e.g. a domain
      # pointed at this machine.
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: ${SPARKY_EXTRA_ORIGINS:-}
      SPARKY_FITNESS_DB_HOST: db
      # SparkyFitness' backup passes this to pg_dump as-is; unset breaks manual/scheduled backups.
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${SPARKY_DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${SPARKY_APP_DB_PASSWORD:?set SPARKY_APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${SPARKY_API_ENCRYPTION_KEY:?set SPARKY_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SPARKY_FITNESS_ADMIN_EMAIL: ${SPARKY_ADMIN_EMAIL:-}
      # Gauntlet signs everyone in from one address, so the per-IP limit has to be higher.
      SPARKY_FITNESS_SIGN_IN_RATELIMIT_MAX: ${SPARKY_SIGN_IN_RATELIMIT_MAX:-60}
      SPARKY_FITNESS_LOG_LEVEL: ${SPARKY_LOG_LEVEL:-INFO}
      # Garmin Connect sync runs in a small companion service.
      GARMIN_MICROSERVICE_URL: http://sparky-garmin:8000
    volumes:
      - sparky-uploads:/app/SparkyFitnessServer/uploads
      - sparky-backup:/app/SparkyFitnessServer/backup

  sparky-garmin:
    build:
      context: ./garmin
      args:
        SPARKY_VERSION: ${SPARKY_VERSION:-v1.7.3}
    image: gauntlet-sparky-garmin:${SPARKY_VERSION:-v1.7.3}
    restart: unless-stopped
    environment:
      GARMIN_SERVICE_PORT: 8000
      # Only for Garmin's China region.
      GARMIN_SERVICE_IS_CN: ${GARMIN_SERVICE_IS_CN:-false}

  sparky-web:
    build:
      context: ./sparky-web
      args:
        SPARKY_VERSION: ${SPARKY_VERSION:-v1.7.3}
        # App sign-in returns (Strava, Fitbit, ...) are handed on to Gauntlet.
        GAUNTLET_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
    image: gauntlet-sparky-web:${SPARKY_VERSION:-v1.7.3}
    restart: unless-stopped
    depends_on: [sparky-api]
    environment:
      SPARKY_FITNESS_SERVER_HOST: sparky-api
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_PUBLIC_URL:-http://localhost:3004}
    ports:
      - '${SPARKY_PORT:-3004}:80'

  # Daily backups of both databases and the SparkyFitness uploads into the `backups` volume, plus
  # the backups and restores asked for on the admin page. See "Backups" in the README.
  backup:
    build: ./backup
    image: gauntlet-backup:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      PGHOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - backups:/backups
      - sparky-uploads:/uploads

  gauntlet:
    build:
      context: ..
    image: gauntlet:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Makes the shared backups folder writable for Gauntlet before it starts using it.
      backup:
        condition: service_started
    environment:
      DATABASE_URL: postgres://gauntlet:${GAUNTLET_DB_PASSWORD}@db:5432/gauntlet
      # Server-to-server over the internal network; links shown to people use the public URL.
      SPARKY_URL: http://sparky-api:3010
      SPARKY_PUBLIC_URL: ${SPARKY_PUBLIC_URL:-http://localhost:3004}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-https://localhost,capacitor://localhost}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-${SPARKY_ADMIN_EMAIL:-}}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      # Release key fingerprint(s) so invite and sign-in links open the Android app.
      ASSETLINKS_SHA256: ${ASSETLINKS_SHA256:-}
      # The Android download and in-app updates come from this repository's latest GitHub release.
      # A private repository also needs GITHUB_TOKEN (read-only access to its contents).
      GITHUB_RELEASES_REPO: ${GITHUB_RELEASES_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Shared with the backup service, for the admin page's Backups section.
      BACKUP_DIR: /backups
    volumes:
      - gauntlet-downloads:/app/downloads
      - backups:/backups
    ports:
      - '${GAUNTLET_PORT:-8080}:8080'

volumes:
  db:
  gauntlet-downloads:
  sparky-uploads:
  sparky-backup:
  backups:
