# Gauntlet next to your SparkyFitness server.
#   cp deploy/.env.example deploy/.env   # fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Then point your reverse proxy (the one serving fit.randalls.cc) at port 8080.
services:
  gauntlet:
    build:
      context: ..
    image: gauntlet:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gauntlet:${POSTGRES_PASSWORD}@db:5432/gauntlet
      SPARKY_URL: ${SPARKY_URL:-https://fit.randalls.cc}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://gauntlet.randalls.cc}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-https://localhost,capacitor://localhost}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
    ports:
      - '${GAUNTLET_PORT:-8080}:8080'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gauntlet
    volumes:
      - gauntlet-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gauntlet']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gauntlet-db:
