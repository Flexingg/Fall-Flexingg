apply plugin: 'com.android.application'

android {
    namespace = "cc.randalls.gauntlet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cc.randalls.gauntlet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets these from the git tag / run number.
        versionCode Integer.parseInt(System.getenv("GAUNTLET_VERSION_CODE") ?: "1")
        versionName System.getenv("GAUNTLET_VERSION_NAME") ?: "0.1.0"
        // Invite links on this host open the app (release builds set it from GAUNTLET_PUBLIC_URL).
        manifestPlaceholders = [appLinkHost: System.getenv("GAUNTLET_LINK_HOST") ?: "gauntlet.randalls.cc"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from the environment (GitHub Actions secrets); without it,
    // release builds are left unsigned and debug builds use the debug key.
    def keystorePath = System.getenv("GAUNTLET_KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("GAUNTLET_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GAUNTLET_KEY_ALIAS")
                keyPassword System.getenv("GAUNTLET_KEY_PASSWORD")
            }
        }
    }
    // The live wallpaper's shader is shared with the web preview: apps/web/shaders -> assets.
    sourceSets {
        main.assets.srcDirs += '../../shaders'
    }
    lint {
        // The release lint pass only reports Kotlin metadata noise from a plugin and adds minutes.
        checkReleaseBuilds = false
    }
    buildTypes {
        release {
            if (keystorePath) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // OnBackPressedCallback / BackEventCompat for PredictiveBackPlugin (1.8+ has the gesture progress).
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Sends today's snapshot to a paired Wear OS watch (best effort; see widget/WearSender).
    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    // Background polling for phone notifications (notify/PollWorker).
    implementation "androidx.work:work-runtime:2.9.1"
    // WorkManager's Worker exposes Guava's ListenableFuture but doesn't bring it in itself.
    implementation "com.google.guava:guava:$guavaVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
