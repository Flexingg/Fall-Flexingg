name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/gauntlet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases
        run: |
          psql -h localhost -U postgres -c "create database gauntlet_test"
          psql -h localhost -U postgres -c "create database gauntlet_e2e"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build PWA
        run: pnpm --filter @gauntlet/web build
      - name: End-to-end (demo API + built PWA)
        run: |
          pnpm --filter @gauntlet/web exec playwright install --with-deps chromium
          # A stub release so the web app's "Download APK" card is exercised too.
          mkdir -p "$RUNNER_TEMP/downloads"
          head -c 4096 /dev/urandom > "$RUNNER_TEMP/downloads/gauntlet-latest.apk"
          cp "$RUNNER_TEMP/downloads/gauntlet-latest.apk" "$RUNNER_TEMP/downloads/gauntlet-v0.0.0.apk"
          echo '{"version":"v0.0.0","builtAt":"2026-01-01T00:00:00Z","sha256":"","file":"gauntlet-v0.0.0.apk","sizeBytes":4096}' > "$RUNNER_TEMP/downloads/latest.json"
          DOWNLOADS_DIR="$RUNNER_TEMP/downloads" DATABASE_URL=postgres://postgres@localhost:5432/gauntlet_e2e PORT=8080 pnpm --filter @gauntlet/api demo &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && break; sleep 1; done
          mkdir -p screens
          E2E_APK=1 SCREENSHOT_DIR=$PWD/screens pnpm --filter @gauntlet/web e2e
      - name: End-to-end (direct mode, no Gauntlet server)
        run: |
          cd apps/web
          VITE_ALLOW_DIRECT_IN_BROWSER=1 pnpm vite build --outDir dist-direct
          pnpm vite preview --outDir dist-direct --port 4175 --strictPort &
          for i in $(seq 1 30); do curl -sf localhost:4175 >/dev/null && break; sleep 1; done
          E2E_DIRECT=1 E2E_BASE_URL=http://localhost:4175 SCREENSHOT_DIR=$PWD/../../screens pnpm exec playwright test e2e/direct.spec.ts
      # Screenshots are a convenience: a full artifact quota mustn't fail the build.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: screens
          path: screens
          if-no-files-found: ignore

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/setup-android-sdk
      - run: pnpm install --frozen-lockfile
      - name: Build web assets for Android
        run: pnpm --filter @gauntlet/web cap:sync
      - name: Build debug APK
        working-directory: apps/web/android
        env:
          GAUNTLET_VERSION_CODE: ${{ github.run_number }}
          GAUNTLET_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gauntlet-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/*.apk

  stack:
    name: Whole backend (real SparkyFitness)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres, SparkyFitness and Gauntlet
        run: |
          {
            for v in POSTGRES_PASSWORD GAUNTLET_DB_PASSWORD SPARKY_DB_PASSWORD SPARKY_APP_DB_PASSWORD; do
              echo "$v=$(openssl rand -hex 24)"
            done
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "SPARKY_API_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } > "$RUNNER_TEMP/stack.env"
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/stack.env" up -d --build
          for i in $(seq 1 90); do
            curl -sf localhost:8080/api/health >/dev/null && curl -sf localhost:3004/api/health >/dev/null && break
            sleep 2
          done
      - name: SparkyFitness server reaches the Garmin service
        run: |
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/stack.env" exec -T sparky-api \
            sh -c 'test "$GARMIN_MICROSERVICE_URL" = http://sparky-garmin:8000 && wget -qO- -T 10 "$GARMIN_MICROSERVICE_URL/openapi.json" | grep -q "\"openapi\""'
      - name: App sign-in returns are handed to Gauntlet
        run: |
          loc="$(curl -s -o /dev/null -w '%{redirect_url}' 'http://localhost:3004/strava/callback?code=x&state=y')"
          test "$loc" = 'http://localhost:8080/oauth/strava?code=x&state=y' || { echo "got: $loc"; exit 1; }
      - name: Linking apps against the real SparkyFitness (Hevy key, wger switch, provider records)
        run: deploy/connections-smoke.sh http://localhost:8080
      - name: Smoke test (sign up, push steps, sync, read back)
        run: deploy/smoke.sh http://localhost:8080 http://localhost:3004
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/stack.env" logs --tail 200

  docker:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gauntlet:ci
