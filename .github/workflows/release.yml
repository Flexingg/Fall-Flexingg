# On every GitHub release: build + sign the Android APK, attach it to the release, then deploy
# the backend to Fly.io (Postgres, SparkyFitness, Gauntlet) with the APK inside the Gauntlet image.
#
# New release without the GitHub UI: Actions -> Release -> Run workflow with a tag that doesn't exist
# yet (e.g. v0.2.0). It builds the selected branch, then creates the tag and release and attaches the
# APK. With an existing release/tag it rebuilds that one.
#
# Dry run: Actions -> Release -> Run workflow with the tag left empty builds a signed APK from the
# selected branch and deploys it as "dev-<sha>", without touching any GitHub release.
#
# One-time setup: see deploy/fly/README.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0. A new tag creates the release from the selected branch after a successful build; an existing one is rebuilt. Leave empty for a dry run (no release is touched).'
        required: false
        default: ''
      deploy:
        description: Deploy to Fly.io after building
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-fly
  cancel-in-progress: false

jobs:
  meta:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      ref: ${{ steps.m.outputs.ref }}
      publish: ${{ steps.m.outputs.publish }}
      create: ${{ steps.m.outputs.create }}
      sha: ${{ steps.m.outputs.sha }}
    steps:
      - id: m
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          create=false
          if [ -n "$tag" ]; then
            version="$tag"; publish=true
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 \
               || gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              ref="$tag"                # rebuild what the tag/release already points at
              if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then create=true; fi
            else
              ref="$SHA"; create=true   # new tag: build the selected branch, create the release after
            fi
          else
            version="dev-${SHA::7}"; ref="$SHA"; publish=false
          fi
          if ! printf '%s' "$version" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::Version '$version' can only contain letters, digits, '.', '_' and '-' (it becomes a file name). Rename the tag."; exit 1
          fi
          { echo "version=$version"; echo "ref=$ref"; echo "publish=$publish"; echo "create=$create"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"
          echo "Building $version from $ref (publish: $publish, create release: $create)"

  apk:
    name: Build signed APK
    needs: meta
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.version }}
    outputs:
      fingerprint: ${{ steps.name.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}

      - name: Check configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ]   || missing+=("secret ANDROID_KEYSTORE_BASE64")
          [ -n "$STORE_PW" ]   || missing+=("secret ANDROID_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ]  || missing+=("secret ANDROID_KEY_ALIAS")
          [ -n "$KEY_PW" ]     || missing+=("secret ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing: ${missing[*]}. A release APK must be signed with the same key every time, or phones can't update it in place. Run scripts/make-keystore.sh and see deploy/fly/README.md."
            exit 1
          fi

      - name: Work out the addresses the app uses
        env:
          PREFIX: ${{ vars.FLY_APP_PREFIX }}
          G_URL: ${{ vars.GAUNTLET_PUBLIC_URL }}
          S_URL: ${{ vars.SPARKY_PUBLIC_URL }}
        run: |
          # Defaults follow deploy/fly/common.sh: <prefix>.fly.dev and <prefix>-sparky.fly.dev.
          if [ -z "$G_URL" ] && [ -n "$PREFIX" ]; then G_URL="https://$PREFIX.fly.dev"; fi
          if [ -z "$S_URL" ] && [ -n "$PREFIX" ]; then S_URL="https://$PREFIX-sparky.fly.dev"; fi
          for u in "$G_URL" "$S_URL"; do
            case "$u" in https://*) ;; '') ;; *) echo "::error::Public URLs must start with https:// (got $u)"; exit 1;; esac
          done
          [ -n "$G_URL" ] || echo "::warning::No GAUNTLET_PUBLIC_URL or FLY_APP_PREFIX: the APK will ask for a server address."
          host="${G_URL#https://}"; host="${host%%/*}"
          {
            echo "VITE_API_URL=${G_URL%/}"
            echo "VITE_SPARKY_URL=${S_URL%/}"
            if [ -n "$host" ]; then echo "GAUNTLET_LINK_HOST=$host"; fi
          } >> "$GITHUB_ENV"
          echo "App uses Gauntlet: ${G_URL:-<asks>}  SparkyFitness: ${S_URL:-<asks>}"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/setup-android-sdk
      - run: pnpm install --frozen-lockfile

      - name: Build web assets for Android
        run: pnpm --filter @gauntlet/web cap:sync

      - name: Prepare signing key
        env:
          RAW_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAW_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TARGET: ${{ runner.temp }}/gauntlet.jks
        run: scripts/prepare-signing.sh

      - name: Build release APK
        working-directory: apps/web/android
        env:
          GAUNTLET_VERSION_CODE: ${{ github.run_number }}
        run: |
          export GAUNTLET_VERSION_NAME="${TAG#v}"
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature and version
        id: name
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          SRC=apps/web/android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$SRC" | head -3
          "$BT/aapt" dump badging "$SRC" | grep -E "^package:"
          FILE="gauntlet-${TAG}.apk"
          mkdir -p dist && cp "$SRC" "dist/$FILE"
          (cd dist && sha256sum "$FILE" > "$FILE.sha256")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          # Signing-certificate fingerprint for Android App Links (AB:CD:... form).
          FP="$("$BT/apksigner" verify --print-certs "$SRC" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.meta.outputs.sha }}
        # Only after the build and signature checks passed, so a failed build leaves no release behind.
        run: gh release create "$TAG" --target "$TARGET" --title "$TAG" --generate-notes

      - name: Attach to the release
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/${{ steps.name.outputs.file }}" "dist/${{ steps.name.outputs.file }}.sha256" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-apk
          path: dist/*.apk
          if-no-files-found: error

  deploy:
    name: Deploy to Fly.io
    needs: [meta, apk]
    if: github.event_name == 'release' || inputs.deploy
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.version }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP_PREFIX: ${{ vars.FLY_APP_PREFIX }}
      GAUNTLET_PUBLIC_URL: ${{ vars.GAUNTLET_PUBLIC_URL }}
      SPARKY_PUBLIC_URL: ${{ vars.SPARKY_PUBLIC_URL }}
      SPARKY_ADMIN_EMAIL: ${{ vars.SPARKY_ADMIN_EMAIL }}
      ASSETLINKS_SHA256: ${{ needs.apk.outputs.fingerprint }}
    steps:
      - name: Check configuration
        run: |
          missing=()
          [ -n "$FLY_API_TOKEN" ]  || missing+=("secret FLY_API_TOKEN")
          [ -n "$FLY_APP_PREFIX" ] || missing+=("variable FLY_APP_PREFIX")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing: ${missing[*]}. See deploy/fly/README.md, then run the Fly setup workflow once."; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: gauntlet-apk
          path: apk
      - name: Put the APK into the Gauntlet image
        run: |
          # Built here rather than passed as a job output: GitHub drops outputs that contain the
          # text of a secret, and the signing key alias ("gauntlet") is part of this name.
          FILE="gauntlet-${TAG}.apk"
          D=deploy/fly/downloads
          cp "apk/$FILE" "$D/$FILE"
          cp "apk/$FILE" "$D/gauntlet-latest.apk"
          printf '{"version":"%s","builtAt":"%s","sha256":"%s","file":"%s","sizeBytes":%s}\n' \
            "$TAG" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(sha256sum "$D/$FILE" | cut -d' ' -f1)" \
            "$FILE" "$(stat -c %s "$D/$FILE")" > "$D/latest.json"
          cat "$D/latest.json"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          EXPECT_APK_VERSION: ${{ needs.meta.outputs.version }}
        run: deploy/fly/deploy.sh
